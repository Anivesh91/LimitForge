services:
  redis:
    image: redis:7-alpine
    container_name: rateshield-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    build: .
    container_name: rateshield-app
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT_A=3000
      - PORT_B=3001
    depends_on:
      - redis
    restart: unless-stopped
